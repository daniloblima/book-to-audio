[project]
name = "book-to-audio"
version = "0.1.0"
description = "Converte PDF em MP3 com capítulos para ouvir num tocador de podcast, com vozes locais e gratuitas."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.130",
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14",
]

[tool.uv]
package = false
